<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Page not found — Vhen Joseph</title>
<meta name="theme-color" content="#F5F3EF" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper:#F5F3EF; --ink:#1A1A1A; --ink-body:#3A3630; --ink-muted:#8B8378;
    --line:rgba(26,26,26,.14);
    --font-sans:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
    --font-serif:'Young Serif',Georgia,'Times New Roman',serif;
    --font-mono:'Space Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:var(--paper); color:var(--ink-body);
    font-family:var(--font-sans); -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; min-height:100dvh; padding:clamp(24px,5vw,64px);
  }
  main { max-width:560px; width:100%; text-align:left; }
  .code {
    font-family:var(--font-mono); font-size:13px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink-muted); margin-bottom:18px;
  }
  h1 {
    font-family:var(--font-serif); font-weight:400; color:var(--ink);
    font-size:clamp(40px,7vw,68px); line-height:1.04; letter-spacing:-.03em;
    margin-bottom:20px; text-wrap:balance;
  }
  p { font-size:clamp(17px,1.6vw,19px); line-height:1.6; margin-bottom:12px; max-width:44ch; }
  .rule { width:48px; height:1px; background:var(--line); margin:28px 0; }
  .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:8px; }
  a.btn {
    display:inline-block; padding:12px 22px; border-radius:100px;
    font-weight:600; font-size:16px; text-decoration:none;
    background:var(--ink); color:var(--paper);
    transition:opacity .2s ease;
  }
  a.btn:hover { opacity:.85; }
  a.btn.ghost { background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); }
  a:focus-visible { outline:2px solid currentColor; outline-offset:3px; border-radius:4px; }
</style>
</head>
<body>
  <main>
    <div class="code">Error 404</div>
    <h1>This page isn't here.</h1>
    <p>The link may be old, or the address may have a typo. Nothing is broken on this end.</p>
    <div class="rule" aria-hidden="true"></div>
    <div class="actions">
      <a class="btn" href="/">Back to home</a>
      <a class="btn ghost" href="/namecard">Namecard</a>
    </div>
  </main>
</body>
</html>
